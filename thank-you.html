<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Nua Modular</title>
  <link rel="icon" type="image/png" href="brand_assets/nua-logo-lockup-on-green.png" />
  <link rel="apple-touch-icon" href="brand_assets/nua-logo-lockup-on-green.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:      #1E5132;
      --brand-deep: #143421;
      --brand-mid:  #2A6B45;
      --brand-sage: #4A8B5C;
      --bg-paper:   #FBFAF6;
      --bg-cream:   #F5F2EB;
      --text-ink:   #0E1A12;
      --text-mute:  #7A857E;
      --rule:       rgba(30,81,50,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      background: var(--bg-paper);
      color: var(--text-ink);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    h1 {
      font-family: 'Fraunces', serif;
      text-wrap: pretty;
      letter-spacing: -0.02em;
      font-weight: 400;
    }
    .nav-inner {
      max-width: 1180px; margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      height: 88px; padding: 0 24px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 13px 28px; border-radius: 999px;
      text-decoration: none; cursor: pointer; border: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: 2px; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-mid); }
    .check {
      width: 56px; height: 56px; border-radius: 999px;
      background: var(--brand); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" aria-label="Nua Modular home">
      <img src="brand_assets/nua-logo.png" alt="Nua Modular" style="height:56px;width:auto" />
    </a>
  </div>
</nav>

<main style="min-height:calc(100vh - 88px);display:flex;align-items:center;justify-content:center;padding:48px 24px">
  <div style="max-width:480px;text-align:center">
    <div class="check">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 12.5l5 5L19 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 style="font-size:clamp(28px,3.5vw,36px);line-height:1.1;margin-bottom:16px">
      Thanks — we've got it.
    </h1>
    <p style="font-size:15px;line-height:1.65;color:rgba(14,26,18,0.6);margin-bottom:32px">
      Your enquiry is in. You'll get a confirmation email shortly, and we'll follow up personally
      based on what you've told us about your site and timeline.
    </p>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </div>
</main>

</body>
</html>
